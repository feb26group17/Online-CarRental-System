server:
  port: 8082

spring:
  application:
    name: ocrs-crud-service

  datasource:
    url: jdbc:mysql://localhost:3306/car_rental_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:your_mysql_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Tables already exist from the SQL dumps — never let Hibernate
    # auto-generate/alter schema against real data.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    # Must be IDENTICAL to user-service's secret — this service only
    # verifies tokens issued by user-service, it never signs its own.
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-min-32-chars-for-hs256}
