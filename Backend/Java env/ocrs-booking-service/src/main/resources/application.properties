server.port=8083

spring.application.name=ocrs-booking-service

spring.datasource.url=jdbc:mysql://localhost:3306/car_rental_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-min-32-chars-for-hs256}

crud.service.url=${CRUD_SERVICE_URL:http://localhost:8082}
crud.service.connect-timeout=10000
crud.service.read-timeout=30000
