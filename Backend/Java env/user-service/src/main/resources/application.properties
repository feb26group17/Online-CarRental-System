server.port=8081

spring.application.name=user-service

spring.datasource.url=jdbc:mysql://localhost:3306/car_rental_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tables already exist from db/00_schema.sql - never let Hibernate
# auto-generate/alter schema against real data, only validate mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 32+ char secret required for HS256. Override with an env var in real deployments.
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-min-32-chars-for-hs256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
