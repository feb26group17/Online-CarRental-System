server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/car_rental_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:your_mysql_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Tables already exist from the SQL dumps (+ 01_admin_table.sql) — never let
    # Hibernate auto-generate/alter schema against real data.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    # 32+ char secret required for HS256. Override with an env var in real deployments.
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-min-32-chars-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 1 day
