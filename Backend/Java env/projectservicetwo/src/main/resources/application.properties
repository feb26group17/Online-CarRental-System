# ===================================
# Application
# ===================================
spring.application.name=projectservicetwo

# ===================================
# Server
# ===================================
server.port=8080

# ===================================
# MySQL Database
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/car_rental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / Hibernate
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DO NOT add spring.jpa.database-platform
# Hibernate will detect the correct dialect automatically.

# ===================================
# Logging
# ===================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE